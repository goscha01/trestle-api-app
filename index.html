<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TracePoint — Identity intelligence, triangulated.</title>
<link rel="icon" href="/icon.png?v=2" type="image/png">
<link rel="shortcut icon" href="/icon.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --navy:#0B1F3A;
    --navy-2:#13294B;
    --navy-3:#1C3458;
    --ink:#0A0A0A;
    --parchment:#F5F1E8;
    --parchment-2:#EDE7D6;
    --paper:#FAF7EF;
    --brass:#C9A74B;
    --brass-2:#A8872F;
    --sage:#4B6A5A;
    --brick:#9B2B2B;
    --line:rgba(11,31,58,0.12);
    --line-2:rgba(11,31,58,0.22);
    --muted:#5A6476;
    --muted-navy:rgba(245,241,232,0.64);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--parchment);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{font-size:15px;line-height:1.55}
  h1,h2,h3,h4,.serif{font-family:'Source Serif 4',Georgia,serif;font-feature-settings:"ss01","ss02";letter-spacing:-0.01em}
  .mono{font-family:'JetBrains Mono',monospace}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:inherit;color:inherit}
  ::selection{background:var(--brass);color:var(--navy)}
  #root{min-height:100vh}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(11,31,58,0.2);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(11,31,58,0.35)}
</style>
</head>
<body>
<div id="root"></div>

<script>
  window.__TWEAKS__ = {
    "palette": "navy"
  };
</script>

<script type="text/babel" data-presets="env,react" src="/app.jsx"></script>
</body>
</html>
